name: Diagnose Reparto Apps Script history

on:
  push:
    branches:
      - main

concurrency:
  group: reparto-2026-appscript-deploy
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          test -n "$CLASP_CREDENTIALS" || (echo "Missing CLASP_CREDENTIALS secret" && exit 1)
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"

      - name: Search historical Apps Script versions for cierre detailed report
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          set +e
          echo "=== CLASP VERSION ==="
          clasp --version
          echo "=== PROJECT VERSIONS ==="
          rm -rf /tmp/reparto-history
          mkdir -p /tmp/reparto-history
          cd /tmp/reparto-history
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json
          clasp versions

          echo "=== PULL VERSION 151 ==="
          rm -f ./*.js ./*.html ./appsscript.json
          clasp pull --versionNumber 151
          echo "=== FILES VERSION 151 ==="
          ls -lah
          echo "=== BROAD CIERRE SEARCH VERSION 151 ==="
          grep -RniE "cierre|folios del d[ií]a|comisi[oó]n mostrada|ARIS BOLSA|venta total|GPS OK" . --include='*.js' --include='*.html' || true
          echo "=== DIAGNOSTIC COMPLETE - NO PUSH PERFORMED ==="
