name: Deploy Reparto 2026 to Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reparto-2026-appscript-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          test -n "$CLASP_CREDENTIALS" || (echo "Missing CLASP_CREDENTIALS secret" && exit 1)
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"

      - name: Pull current Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$APPS_SCRIPT_ID" || (echo "Missing APPS_SCRIPT_ID secret" && exit 1)
          rm -rf /tmp/reparto-remote
          mkdir -p /tmp/reparto-remote
          cd /tmp/reparto-remote
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json
          clasp pull

      - name: Overlay managed modules from GitHub
        run: |
          test -f "$GITHUB_WORKSPACE/MonitorPedidos.gs" || (echo "MonitorPedidos.gs not found" && exit 1)
          test -f "$GITHUB_WORKSPACE/MonitorMake.gs" || (echo "MonitorMake.gs not found" && exit 1)
          test -f "$GITHUB_WORKSPACE/SYNC_CARGAS_OPSU.gs.js" || (echo "SYNC_CARGAS_OPSU.gs.js not found" && exit 1)
          test -f "$GITHUB_WORKSPACE/CIERRES_REPARTO.js" || (echo "CIERRES_REPARTO.js not found" && exit 1)
          SHORT_SHA="${GITHUB_SHA::8}"

          rm -f /tmp/reparto-remote/MonitorPedidos.js /tmp/reparto-remote/MonitorPedidos.gs
          {
            echo "// DEPLOY_VERSION: REPARTO-MONITOR-${SHORT_SHA}"
            echo "// DEPLOYED_FROM_GITHUB: ${GITHUB_SHA}"
            echo
            cat "$GITHUB_WORKSPACE/MonitorPedidos.gs"
          } > /tmp/reparto-remote/MonitorPedidos.js

          rm -f /tmp/reparto-remote/MonitorMake.js /tmp/reparto-remote/MonitorMake.gs
          {
            echo "// DEPLOY_VERSION: REPARTO-MAKE-WATCHDOG-${SHORT_SHA}"
            echo "// DEPLOYED_FROM_GITHUB: ${GITHUB_SHA}"
            echo
            cat "$GITHUB_WORKSPACE/MonitorMake.gs"
          } > /tmp/reparto-remote/MonitorMake.js

          rm -f /tmp/reparto-remote/SYNC_CARGAS_OPSU.js /tmp/reparto-remote/SYNC_CARGAS_OPSU.gs
          {
            echo "// DEPLOY_VERSION: REPARTO-CARGAS-${SHORT_SHA}"
            echo "// DEPLOYED_FROM_GITHUB: ${GITHUB_SHA}"
            echo
            cat "$GITHUB_WORKSPACE/SYNC_CARGAS_OPSU.gs.js"
          } > /tmp/reparto-remote/SYNC_CARGAS_OPSU.js

          rm -f /tmp/reparto-remote/CIERRES_REPARTO.js /tmp/reparto-remote/CIERRES_REPARTO.gs
          {
            echo "// DEPLOY_VERSION: REPARTO-CIERRES-${SHORT_SHA}"
            echo "// DEPLOYED_FROM_GITHUB: ${GITHUB_SHA}"
            echo
            cat "$GITHUB_WORKSPACE/CIERRES_REPARTO.js"
          } > /tmp/reparto-remote/CIERRES_REPARTO.js

      - name: Integrate watchdogs and disable legacy Telegram monitor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('/tmp/reparto-remote/SYNC_CARGAS_OPSU.js')
          if not path.exists():
              raise SystemExit('SYNC_CARGAS_OPSU.js not found after overlay')

          text = path.read_text(encoding='utf-8')

          # Telegram ya vive en el proyecto independiente Pedidos_Telegram.
          # Conservamos el código legacy en Reparto para rollback, pero dejamos de ejecutarlo
          # desde el monitor central para evitar dobles envíos, dobles retrasos y carreras.
          legacy = """  try {\n\n    ejecutarMonitoreosCadaMinuto();\n\n  } catch (error) {\n\n    console.error(\n      'MONITOR CENTRAL - error en monitoreos existentes: ' +\n      error.stack\n    );\n\n  }\n\n\n"""
          if legacy in text:
              text = text.replace(
                  legacy,
                  """  // TELEGRAM MIGRADO A Pedidos_Telegram\n  // El monitor legacy ejecutarMonitoreosCadaMinuto() se conserva en el proyecto\n  // únicamente como respaldo y NO se ejecuta desde Reparto.\n\n\n""",
                  1
              )

          # Insert both watchdogs immediately before the CARGAS_OPSU cycle.
          if 'monitorPedidos();' not in text or 'monitorMakeEscenarios(false);' not in text:
              old = """  try {\n\n    const resultadoCargas =\n      CARGAS_OPSU_monitoreoCadaMinuto();\n"""
              block = """  // MONITOR PEDIDOS WHATSAPP\n  try {\n\n    monitorPedidos();\n\n  } catch (error) {\n\n    console.error(\n      'MONITOR CENTRAL - error en monitorPedidos: ' +\n      error.stack\n    );\n\n  }\n\n\n  // MONITOR MAKE ESCENARIOS\n  try {\n\n    monitorMakeEscenarios(false);\n\n  } catch (error) {\n\n    console.error(\n      'MONITOR CENTRAL - error en monitorMakeEscenarios: ' +\n      error.stack\n    );\n\n  }\n\n\n  // CARGAS OPSU\n  try {\n\n    const resultadoCargas =\n      CARGAS_OPSU_monitoreoCadaMinuto();\n"""
              if old not in text:
                  raise SystemExit('Could not find CARGAS_OPSU execution block in MONITOREO_CENTRAL_cadaMinuto')
              text = text.replace(old, block, 1)

          # Ensure installer removes any old independent Telegram/monitorPedidos triggers.
          if "handler ===\n            'monitorPedidos'" not in text and "handler === 'monitorPedidos'" not in text:
              old = """          handler ===\n            'ejecutarMonitoreosCadaMinuto' ||\n          handler ===\n            'CARGAS_OPSU_monitoreoCadaMinuto' ||\n"""
              new = """          handler ===\n            'ejecutarMonitoreosCadaMinuto' ||\n          handler ===\n            'monitorPedidos' ||\n          handler ===\n            'CARGAS_OPSU_monitoreoCadaMinuto' ||\n"""
              if old not in text:
                  raise SystemExit('Could not find trigger cleanup block in CARGAS_OPSU_instalarMonitoreo1Minuto')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          print('Reparto central listo: Telegram legacy desactivado; watchdogs preservados')
          PY

      - name: Validate critical modules before push
        run: |
          grep -q "monitorPedidos();" /tmp/reparto-remote/SYNC_CARGAS_OPSU.js
          grep -q "monitorMakeEscenarios(false);" /tmp/reparto-remote/SYNC_CARGAS_OPSU.js
          grep -q "hoy.getDay() === 6" /tmp/reparto-remote/SYNC_CARGAS_OPSU.js
          grep -q "function monitorPedidos" /tmp/reparto-remote/MonitorPedidos.js
          grep -q "function monitorMakeEscenarios" /tmp/reparto-remote/MonitorMake.js
          grep -q "SuperIce_Promo_Reparto" /tmp/reparto-remote/CIERRES_REPARTO.js
          if grep -q "ejecutarMonitoreosCadaMinuto();" /tmp/reparto-remote/SYNC_CARGAS_OPSU.js; then
            echo "ERROR: legacy Telegram monitor is still called from Reparto central"
            exit 1
          fi
          echo "Validation OK: Telegram migrated + CARGAS + CIERRES + webhook monitor + Make watchdog"

      - name: Push safe mirror to Apps Script
        run: |
          cd /tmp/reparto-remote
          clasp push --force
