name: Diagnose Reparto Apps Script history

on:
  push:
    branches:
      - main

concurrency:
  group: reparto-2026-appscript-deploy
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          test -n "$CLASP_CREDENTIALS" || (echo "Missing CLASP_CREDENTIALS secret" && exit 1)
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"

      - name: Search historical Apps Script versions for cierre detailed report
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          set +e
          echo "=== CLASP VERSION ==="
          clasp --version
          echo "=== PROJECT VERSIONS ==="
          rm -rf /tmp/reparto-history
          mkdir -p /tmp/reparto-history
          cd /tmp/reparto-history
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json
          clasp versions

          echo "=== SEARCH VERSIONS 110..129 ==="
          for v in $(seq 110 129); do
            rm -f ./*.js ./*.html ./appsscript.json
            out=$(clasp pull --versionNumber "$v" 2>&1)
            status=$?
            if [ $status -ne 0 ]; then
              continue
            fi
            if grep -RniE "Cierre detallado|Consolidado final por precio|precios tomados de GIROS|Imprimir detalle" . --include='*.js' --include='*.html' >/tmp/matches.txt 2>/dev/null; then
              echo "=== MATCH VERSION $v ==="
              cat /tmp/matches.txt
              for f in $(cut -d: -f1 /tmp/matches.txt | sort -u); do
                echo "--- FILE $f (version $v) ---"
                grep -n -C 40 -E "Cierre detallado|Consolidado final por precio|precios tomados de GIROS|Imprimir detalle" "$f" || true
              done
            fi
          done

          echo "=== DIAGNOSTIC COMPLETE - NO PUSH PERFORMED ==="
