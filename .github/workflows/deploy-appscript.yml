name: Deploy Reparto 2026 to Apps Script

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: reparto-2026-appscript-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Configure clasp credentials
        env:
          CLASP_CREDENTIALS: ${{ secrets.CLASP_CREDENTIALS }}
        run: |
          test -n "$CLASP_CREDENTIALS" || (echo "Missing CLASP_CREDENTIALS secret" && exit 1)
          printf '%s' "$CLASP_CREDENTIALS" > "$HOME/.clasprc.json"

      - name: Pull current Apps Script project
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$APPS_SCRIPT_ID" || (echo "Missing APPS_SCRIPT_ID secret" && exit 1)
          rm -rf /tmp/reparto-remote
          mkdir -p /tmp/reparto-remote
          cd /tmp/reparto-remote
          printf '{"scriptId":"%s","rootDir":"."}\n' "$APPS_SCRIPT_ID" > .clasp.json
          clasp pull

      - name: Overlay watchdog modules with deploy versions
        run: |
          test -f "$GITHUB_WORKSPACE/MonitorPedidos.gs" || (echo "MonitorPedidos.gs not found" && exit 1)
          test -f "$GITHUB_WORKSPACE/MonitorMake.gs" || (echo "MonitorMake.gs not found" && exit 1)
          SHORT_SHA="${GITHUB_SHA::8}"

          rm -f /tmp/reparto-remote/MonitorPedidos.js /tmp/reparto-remote/MonitorPedidos.gs
          {
            echo "// DEPLOY_VERSION: REPARTO-MONITOR-${SHORT_SHA}"
            echo "// DEPLOYED_FROM_GITHUB: ${GITHUB_SHA}"
            echo
            cat "$GITHUB_WORKSPACE/MonitorPedidos.gs"
          } > /tmp/reparto-remote/MonitorPedidos.js

          rm -f /tmp/reparto-remote/MonitorMake.js /tmp/reparto-remote/MonitorMake.gs
          {
            echo "// DEPLOY_VERSION: REPARTO-MAKE-WATCHDOG-${SHORT_SHA}"
            echo "// DEPLOYED_FROM_GITHUB: ${GITHUB_SHA}"
            echo
            cat "$GITHUB_WORKSPACE/MonitorMake.gs"
          } > /tmp/reparto-remote/MonitorMake.js

      - name: Integrate watchdogs into central trigger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('/tmp/reparto-remote')
          candidates = list(root.glob('SYNC_CARGAS_OPSU*.js')) + list(root.glob('SYNC_CARGAS_OPSU*.gs'))
          if not candidates:
              raise SystemExit('SYNC_CARGAS_OPSU file not found after clasp pull')

          path = candidates[0]
          text = path.read_text(encoding='utf-8')

          # 1) Insert monitorPedidos() into the existing central minute monitor.
          if 'MONITOR PEDIDOS WHATSAPP' not in text:
              marker = """  // --------------------------------------------------------------------------\n  // CARGAS OPSU\n  // --------------------------------------------------------------------------\n"""
              block = """  // --------------------------------------------------------------------------\n  // MONITOR PEDIDOS WHATSAPP\n  // --------------------------------------------------------------------------\n\n  try {\n\n    monitorPedidos();\n\n  } catch (error) {\n\n    console.error(\n      'MONITOR CENTRAL - error en monitorPedidos: ' +\n      error.stack\n    );\n\n  }\n\n\n"""
              if marker not in text:
                  raise SystemExit('Could not find CARGAS OPSU marker in MONITOREO_CENTRAL_cadaMinuto')
              text = text.replace(marker, block + marker, 1)

          # 2) Insert Make scenario watchdog before CARGAS OPSU.
          if 'MONITOR MAKE ESCENARIOS' not in text:
              marker = """  // --------------------------------------------------------------------------\n  // CARGAS OPSU\n  // --------------------------------------------------------------------------\n"""
              block = """  // --------------------------------------------------------------------------\n  // MONITOR MAKE ESCENARIOS\n  // --------------------------------------------------------------------------\n\n  try {\n\n    monitorMakeEscenarios(false);\n\n  } catch (error) {\n\n    console.error(\n      'MONITOR CENTRAL - error en monitorMakeEscenarios: ' +\n      error.stack\n    );\n\n  }\n\n\n"""
              if marker not in text:
                  raise SystemExit('Could not find CARGAS OPSU marker for Make watchdog insertion')
              text = text.replace(marker, block + marker, 1)

          # 3) Ensure installer removes any old independent monitorPedidos trigger.
          if "handler ===\n            'monitorPedidos'" not in text and "handler === 'monitorPedidos'" not in text:
              old = """          handler ===\n            'ejecutarMonitoreosCadaMinuto' ||\n          handler ===\n            'CARGAS_OPSU_monitoreoCadaMinuto' ||\n"""
              new = """          handler ===\n            'ejecutarMonitoreosCadaMinuto' ||\n          handler ===\n            'monitorPedidos' ||\n          handler ===\n            'CARGAS_OPSU_monitoreoCadaMinuto' ||\n"""
              if old not in text:
                  raise SystemExit('Could not find trigger cleanup block in CARGAS_OPSU_instalarMonitoreo1Minuto')
              text = text.replace(old, new, 1)

          # 4) Keep the central-monitor sequence comments accurate when possible.
          text = text.replace(
              "//   1. Ejecuta los monitoreos existentes del proyecto.\n//   2. Ejecuta monitorPedidos() (watchdog ENTRADASWEBOOK -> PEDIDOS).\n//   3. Ejecuta la sincronización OPSU -> Reparto.",
              "//   1. Ejecuta los monitoreos existentes del proyecto.\n//   2. Ejecuta monitorPedidos() (watchdog ENTRADASWEBOOK -> PEDIDOS).\n//   3. Ejecuta monitorMakeEscenarios() (watchdog Make -> Pushover).\n//   4. Ejecuta la sincronización OPSU -> Reparto."
          )

          path.write_text(text, encoding='utf-8')
          print(f'Central monitor patched safely in {path.name}')
          PY

      - name: Push safe mirror to Apps Script
        run: |
          cd /tmp/reparto-remote
          clasp push --force
